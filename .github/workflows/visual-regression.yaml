name: visual regression

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: analyze visual regression
    runs-on: ubuntu-latest
    outputs:
      comment-body: ${{ steps.format_comment.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: itsferdiardiansa/ci-toolbox/actions/setup-node@v1.1.2
        
      - name: Build Storybook
        run: pnpm --filter @clera/storybook build

      - name: Run Chromatic
        id: chromatic_run
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          storybookBuildDir: storybook-static
          exitZeroOnChanges: true
          autoAcceptChanges: main

      - name: Format comment body
        id: format_comment
        env:
          CHANGE_COUNT: ${{ steps.chromatic_run.outputs.changeCount }}
          BUILD_URL: ${{ steps.chromatic_run.outputs.buildUrl }}
        run: |
          CHANGES="${CHANGE_COUNT:-0}"
          if [ "$CHANGES" -gt 0 ]; then
            BODY="### 🔍 Visual Regression"$'\n'"$CHANGES visual change(s) detected - [review in Chromatic](${BUILD_URL}) before merging."
          else
            BODY="### ✅ Visual Regression"$'\n'"No visual changes detected. [View build](${BUILD_URL})."
          fi
          {
            echo 'body<<EOF'
            echo "$BODY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          
  comment-pr:
    name: comment-pr
    runs-on: ubuntu-latest
    needs: chromatic
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post or Update Comment
        uses: itsferdiardiansa/ci-toolbox/actions/post-comment@v1.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: visual-regression-report
          body: ${{ needs.chromatic.outputs.comment-body }}