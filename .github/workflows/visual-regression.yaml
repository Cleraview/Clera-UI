name: visual regression

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: analyze visual regression
    runs-on: ubuntu-latest
    outputs:
      comment-body: ${{ steps.format_comment.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: itsferdiardiansa/ci-toolbox/actions/setup-node@v1.1.2
        
      - name: Run Chromatic
        id: chromatic_run
        run: pnpm --filter @clera/storybook exec chromatic --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }} --build-script-name=build
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        continue-on-error: true
      
      - name: Format comment body
        id: format_comment
        run: |
          if [ "${{ steps.chromatic_run.outcome }}" = "success" ]; then
            BODY=$'### ✅ Visual Regression\nNo visual changes detected.'
          else
            BODY=$'### 🔍 Visual Regression\nVisual changes detected or the Storybook build failed — please review the run in Chromatic before merging.'
          fi
          {
            echo 'body<<EOF'
            echo "$BODY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          
  comment-pr:
    name: comment-pr
    runs-on: ubuntu-latest
    needs: chromatic
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post or Update Comment
        uses: itsferdiardiansa/ci-toolbox/actions/post-comment@v1.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: visual-regression-report
          body: ${{ needs.chromatic.outputs.comment-body }}